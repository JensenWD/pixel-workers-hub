name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Test
        run: swift test

      - name: Build the app (Apple silicon and Intel)
        run: UNIVERSAL=1 scripts/build-app.sh

      - name: Zip it
        run: ditto -c -k --keepParent "build/Pixel Workers Hub.app" Pixel-Workers-Hub.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Pixel-Workers-Hub
          path: Pixel-Workers-Hub.zip

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" Pixel-Workers-Hub.zip --title "$GITHUB_REF_NAME" --generate-notes
